version: '3.9'
services:
  web:
    build: .
    command: python backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    env_file:
      - ./infra/env.example
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: dragondance
      POSTGRES_USER: dragondance
      POSTGRES_PASSWORD: dragondance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
